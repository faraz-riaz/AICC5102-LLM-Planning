[project]
name = "llm-heuristics"
version = "0.1.0"
description = "Using LLMs to learn heuristics for classical planning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.8",
    "google-genai>=2.34.0",
    "lab>=8.4",
    "openai>=3.45.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
