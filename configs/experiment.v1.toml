schema_version = "1.0"
config_id = "pilot-v1"
experiment_configuration_version = "1.0.0"
benchmark_version = "aicc5102-90-v1"
benchmark_manifest = "benchmarks/manifest.json"
selected_domains = ["blocksworld", "miconic", "transport"]

[resources]
provisional = true
time_limit_s = 60
memory_limit_mb = 4096

[seed_policy]
base_seed = 5102
strategy = "sha256-derived-per-run"
description = "Derive stable run seeds from base seed plus canonical run fields; never use hash()."

[heuristics]
identifiers = ["hff", "hmax"]

[algorithms]
foundation_default = "gbfs_early_goal_test"
identifiers = ["gbfs_early_goal_test", "astar", "wastar", "ids"]

[outputs]
raw = "results/raw/{config_id}/{run_id}.json"
derived = "results/derived/{config_id}/"
figures = "results/figures/{config_id}/"

[statuses]
vocabulary = ["success", "unsolved", "timeout", "memory_limit", "invalid_plan", "error"]

[schema]
result_record = "configs/result.schema.json"
